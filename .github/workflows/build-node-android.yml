name: Build Android APK (prebuilt libnode.so)

# Uses a prebuilt Android Node.js shared library.
# No Node.js source compilation, make, or ICU build is required.

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Android APK (arm64-v8a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout MYnestAI
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare prebuilt Android Node (libnode.so + headers)
        run: |
          npm run android:node:prepare

      - name: Validate libnode.so (ARM64 Android ELF)
        run: |
          npm run android:node:validate

      - name: Prepare Android dependencies
        run: |
          npm install

      - name: Prepare Android project
        run: |
          npm run android:prepare

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mynestai-android-arm64
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30